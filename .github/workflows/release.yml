name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: 'Rust build profile'
        required: false
        default: 'release'
        type: choice
        options: [release, dist]

env:
  CARGO_TERM_COLOR: always
  BUILD_PROFILE: ${{ inputs.profile || 'release' }}

jobs:
  # ── Linux x86_64 ─────────────────────────────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libglib2.0-dev libcairo2-dev \
            libgdk-pixbuf2.0-dev libpango1.0-dev libepoxy-dev \
            libdbus-1-dev libssl-dev librsvg2-dev libspeechd-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: linux-x86_64-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-x86_64-cargo-

      - uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: linux-x86_64-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-x86_64-build-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/litert-sys
            ~/.cache/litert-lm-sys
            ~/.cache/litert-lm-sys-webgpu
          key: linux-x86_64-litert-${{ hashFiles('src-tauri/build.rs') }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: '${{ github.ref_name }}'
          generateReleaseNotes: true
          args: ${{ env.BUILD_PROFILE == 'dist' && '-- --profile dist' || '' }}

  # ── Linux aarch64 (Pi 5 / ARM64 servers) ─────────────────────────────────────
  build-linux-aarch64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: tauri-cblite-litert

      # GitHub Actions ubuntu-24.04 uses deb822 sources without arch constraints.
      # Rewrite to per-arch mirror entries so arm64 packages come from ports.ubuntu.com.
      - name: Set up multi-arch apt sources
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list
          sudo dpkg --add-architecture arm64
          printf '%s\n' \
            'deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse' \
            'deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse' \
            'deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse' \
            | sudo tee /etc/apt/sources.list

      - name: Install cross-compile toolchain + ARM64 sysroot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            build-essential pkg-config libclang-dev clang patchelf curl \
            libwebkit2gtk-4.1-dev:arm64 libgtk-3-dev:arm64 librsvg2-dev:arm64 \
            libssl-dev:arm64 libpango1.0-dev:arm64 libglib2.0-dev:arm64 \
            libsoup-3.0-dev:arm64 libjavascriptcoregtk-4.1-dev:arm64 \
            libspeechd-dev:arm64

      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: tauri-cblite-litert/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: linux-aarch64-cargo-${{ hashFiles('tauri-cblite-litert/src-tauri/Cargo.lock') }}
          restore-keys: linux-aarch64-cargo-

      - uses: actions/cache@v4
        with:
          path: tauri-cblite-litert/src-tauri/target
          key: linux-aarch64-build-${{ hashFiles('tauri-cblite-litert/src-tauri/Cargo.lock') }}
          restore-keys: linux-aarch64-build-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/litert-sys
            ~/.cache/litert-lm-sys
            ~/.cache/litert-lm-sys-webgpu
          key: linux-aarch64-litert-${{ hashFiles('tauri-cblite-litert/src-tauri/build.rs') }}

      - name: Install JS dependencies
        working-directory: tauri-cblite-litert
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: tauri-cblite-litert
        run: pnpm build

      - name: Build libspeechd stub (aarch64)
        working-directory: tauri-cblite-litert/src-tauri
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC \
            -Wl,-soname,libspeechd.so.2 \
            libspeechd-stub.c \
            -o libspeechd-stub.so

      - name: Phase 1 — Rust build (downloads + prepares native libs)
        working-directory: tauri-cblite-litert/src-tauri
        env:
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu --manifest-path Cargo.toml

      - name: Fetch libcblite arm64 (if missing from Cargo git checkout)
        run: |
          CBL_ARM64=$(find ~/.cargo/git/checkouts -type d \
            -path '*/couchbase-lite-rust-*/*/libcblite_community/lib/aarch64-unknown-linux-gnu' \
            2>/dev/null | head -1)
          if [[ -n "$CBL_ARM64" && ! -f "$CBL_ARM64/libcblite.so.4" ]]; then
            TMPDIR_CBL=$(mktemp -d)
            curl -fL 'https://packages.couchbase.com/releases/couchbase-lite-c/4.0.3/couchbase-lite-c-community-4.0.3-linux-arm64.tar.gz' \
              | tar -xz -C "$TMPDIR_CBL"
            find "$TMPDIR_CBL" -name 'libcblite.so.4' -exec cp {} "$CBL_ARM64/" \;
            rm -rf "$TMPDIR_CBL"
            echo "Installed libcblite.so.4 → $CBL_ARM64"
          fi

      - name: Collect native libs into bundle-libs/
        working-directory: tauri-cblite-litert/src-tauri
        run: |
          mkdir -p bundle-libs
          LITERT_OUT=$(find target/aarch64-unknown-linux-gnu/release/build/tauri-cblite-litert-*/out \
            -maxdepth 0 -type d 2>/dev/null | head -1)
          [[ -n "$LITERT_OUT" ]] && cp "$LITERT_OUT"/lib*.so bundle-libs/ 2>/dev/null || true
          CBL_LIB=$(find ~/.cargo/git/checkouts \
            -path '*/couchbase-lite-rust-*/*/libcblite_community/lib/aarch64-unknown-linux-gnu/libcblite.so.4' \
            2>/dev/null | head -1)
          [[ -n "$CBL_LIB" ]] && cp "$CBL_LIB" bundle-libs/
          echo "bundle-libs contents:"; ls bundle-libs/

      - name: Phase 2 — Bundle .deb
        working-directory: tauri-cblite-litert
        env:
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [[ "$BUILD_PROFILE" == "dist" ]]; then
            pnpm tauri build --target aarch64-unknown-linux-gnu --bundles deb -- --profile dist
          else
            pnpm tauri build --target aarch64-unknown-linux-gnu --bundles deb
          fi

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: tauri-cblite-litert/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb

  # ── Android (AAB for Google Play) ────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      # couchbase-lite-rust only ships prebuilt libs for 64-bit Android targets.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: android-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: android-cargo-

      - uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: android-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: android-build-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        run: pnpm tauri android init

      # litertlm-android 0.11.0 is compiled with Kotlin 2.3.0 metadata;
      # tauri android init generates a project with Kotlin 1.9.0 (buildscript
      # classpath format) which can only read metadata ≤2.0.0.
      # Use Python to match BOTH classpath and plugins-block formats reliably.
      - name: Patch Android project — upgrade Kotlin to 2.3.0
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          root = pathlib.Path("src-tauri/gen/android")

          for f in root.rglob("*.gradle.kts"):
              t = f.read_text()
              before = t
              # buildscript-classpath format: classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:X.Y.Z")
              t = re.sub(r'(kotlin-gradle-plugin:)[^"]+', r'\g<1>2.3.0', t)
              # plugins-block format: id("org.jetbrains.kotlin.android") version "X.Y.Z"
              t = re.sub(r'(id\("org\.jetbrains\.kotlin(?:\.android)?"\)\s+version\s+")[^"]+', r'\g<1>2.3.0', t)
              if t != before:
                  f.write_text(t)
                  print(f"Patched {f}")

          for f in root.rglob("*.toml"):
              t = f.read_text()
              before = t
              t = re.sub(r'^(kotlin\s*=\s*")[^"]+', r'\g<1>2.3.0', t, flags=re.MULTILINE)
              if t != before:
                  f.write_text(t)
                  print(f"Patched {f}")

          print("\n=== build.gradle.kts after patch ===")
          bgk = root / "build.gradle.kts"
          if bgk.exists():
              print(bgk.read_text())
          EOF

      # Kotlin 2.3.0 removed the kotlinOptions.jvmTarget String setter.
      # Patch ALL Android modules: our app, tauri-android, and every plugin
      # subproject listed in tauri.settings.gradle (including cargo-registry paths).
      - name: Patch all Android modules — migrate kotlinOptions to compilerOptions
        run: |
          # Cargo sets registry source files read-only (444). Make the whole
          # cargo source tree writable so the Python script can edit them.
          chmod -R u+w ~/.cargo/registry/src ~/.cargo/git/checkouts 2>/dev/null || true

          python3 - <<'EOF'
          import pathlib, re

          def patch_kotlin_options(f):
              try:
                  t = f.read_text()
              except PermissionError as e:
                  print(f"SKIP (permission denied): {f}: {e}")
                  return False
              if 'kotlinOptions' not in t:
                  return False
              m = re.search(r'kotlinOptions\s*\{[^}]*jvmTarget\s*=\s*"([^"]+)"', t, re.DOTALL)
              jvm_ver = m.group(1).replace('.', '_') if m else '1_8'
              t = re.sub(r'\n?\s*kotlinOptions\s*\{[^}]*\}', '', t, flags=re.DOTALL)
              if 'JvmTarget' not in t:
                  if 'import java.util.Properties' in t:
                      t = t.replace(
                          'import java.util.Properties',
                          'import java.util.Properties\nimport org.jetbrains.kotlin.gradle.dsl.JvmTarget'
                      )
                  else:
                      t = 'import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n' + t
              if 'compilerOptions' not in t:
                  t += f'\nkotlin {{\n    compilerOptions {{\n        jvmTarget.set(JvmTarget.JVM_{jvm_ver})\n    }}\n}}\n'
              f.write_text(t)
              return True

          # Collect all Android module directories: generated project + all subprojects
          dirs = [pathlib.Path("src-tauri/gen/android")]
          settings = pathlib.Path("src-tauri/gen/android/tauri.settings.gradle")
          if settings.exists():
              for m in re.finditer(r"projectDir\s*=\s*new File\(['\"]([^'\"]+)['\"]", settings.read_text()):
                  d = pathlib.Path(m.group(1))
                  if d.exists():
                      dirs.append(d)
                      print(f"Found subproject: {d}")

          for d in dirs:
              for f in d.rglob("*.gradle.kts"):
                  if patch_kotlin_options(f):
                      print(f"Patched: {f}")
          EOF

      # litert and litertlm-android AARs both ship libLiteRt.so; Gradle refuses
      # to merge two copies. Append a packaging block to pick the first one found.
      - name: Patch app/build.gradle.kts — resolve duplicate libLiteRt.so
        run: |
          cat >> src-tauri/gen/android/app/build.gradle.kts <<'GRADLE'

          // litert and litertlm-android AARs both ship libLiteRt.so.
          android {
              packaging {
                  jniLibs {
                      pickFirsts += setOf("**/libLiteRt.so")
                  }
              }
          }
          GRADLE

      # tauri-plugin-cblite declares usesCleartextTraffic=true; the app manifest
      # defaults to false. The merger refuses to pick a winner unless the app
      # explicitly says which value wins via tools:replace.
      - name: Patch AndroidManifest — resolve usesCleartextTraffic conflict
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          # Add tools namespace to <manifest> if not present
          if 'xmlns:tools=' not in t:
              t = t.replace(
                  'xmlns:android="http://schemas.android.com/apk/res/android"',
                  'xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"'
              )
          # Add tools:replace to <application> if not present
          if 'tools:replace=' not in t:
              t = re.sub(
                  r'(<application\b)',
                  r'\1\n        tools:replace="android:usesCleartextTraffic"',
                  t, count=1
              )
          p.write_text(t)
          print("Patched:", p)
          EOF

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ env.NDK_HOME }}
        with:
          mobile: android
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: '${{ github.ref_name }}'
          args: '--aab --target aarch64 --target x86_64'

  # ── Web (Vite standalone, no Tauri runtime) ───────────────────────────────────
  build-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_WEB_MODE: 'true'
          TAURI_ENV_PLATFORM: ''

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
