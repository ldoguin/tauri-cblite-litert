[package]
name = "tauri-cblite-litert"
version = "0.1.0"
description = "Offline RAG chatbot — LiteRT inference + CouchbaseLite storage"
authors = []
edition = "2021"

[lib]
name = "tauri_cblite_litert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tauri-cblite-litert"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Used by build.rs to download missing LiteRT prebuilt libraries on Linux/Windows.
ureq = { version = "2", features = ["tls"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-cblite = { git = "https://github.com/ldoguin/tauri-plugin-cblite", rev = "1f2b3bb3a85bb613b3c1127352b74a68b02806e5", features = ["native-cbl"] }
tauri-plugin-litert = { git = "https://github.com/ldoguin/tauri-plugin-litert", rev = "6ae9f40" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "net", "macros", "sync"] }
futures-util = "0.3"
base64 = "0.22"

[dev-dependencies]
# Direct access to the LiteRT backends for integration tests in tests/
litert   = { git = "https://github.com/ldoguin/tauri-plugin-litert", rev = "6ae9f40" }
litertlm = { git = "https://github.com/ldoguin/tauri-plugin-litert", rev = "6ae9f40" }


[profile.release]
opt-level = "s"   # optimise for binary size
# strip = false so crash reports retain symbol names; use the dist profile for
# stripped distribution builds where binary size matters more than debuggability.
strip = false
lto = true
codegen-units = 1

# Use `cargo build --profile dist` for stripped distribution artifacts.
[profile.dist]
inherits = "release"
strip = true
panic = "abort"


[[example]]
name = "qwen3_test"
path = "examples/qwen3_test.rs"

[[example]]
name = "gpu_crash_test"
path = "examples/gpu_crash_test.rs"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
