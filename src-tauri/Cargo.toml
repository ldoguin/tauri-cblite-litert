[package]
name = "tauri-cblite-litert"
version = "0.1.0"
description = "Offline RAG chatbot — LiteRT inference + CouchbaseLite storage"
authors = []
edition = "2021"

[lib]
name = "tauri_cblite_litert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tauri-cblite-litert"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Used by build.rs to download missing LiteRT prebuilt libraries on Linux.
ureq = { version = "2", features = ["tls"] }
sha2 = "0.10"
hex = "0.4"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
# Local checkouts so the iOS (Swift) native side can be developed in-tree.
# native-cbl (the desktop CBL C library) is enabled only on desktop below — on
# mobile the native Couchbase Lite SDK (Kotlin/Swift) is used instead.
tauri-plugin-cblite = { path = "../../tauri-plugin-cblite", default-features = false }
tauri-plugin-litert = { path = "../../tauri-plugin-litert" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util"] }
futures-util = "0.3"
base64 = "0.22"

# Desktop only: pull in the native Couchbase Lite C library. Excluded on iOS and
# Android, where the plugin delegates to the platform-native CBL SDK.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-cblite = { path = "../../tauri-plugin-cblite", features = ["native-cbl"] }

[dev-dependencies]
# Direct access to the LiteRT backends for integration tests in tests/
litert   = "0.2"
litertlm = "0.2"

[profile.release]
opt-level = "s"   # optimise for binary size
# strip = false so crash reports retain symbol names; use the dist profile for
# stripped distribution builds where binary size matters more than debuggability.
strip = false
lto = true
codegen-units = 1

# Use `cargo build --profile dist` for stripped distribution artifacts.
[profile.dist]
inherits = "release"
strip = true
panic = "abort"

# Patched swift-rs: passes `--triple` to `swift build` for iOS targets so
# SwiftPM selects the correct .xcframework slice for binaryTarget dependencies
# (CouchbaseLiteSwift, CLiteRTLM). Upstream 1.0.7 only overrides the swiftc
# target, leaving SPM planning for macOS — which breaks any plugin whose Swift
# package depends on a binary framework. See swift-rs/src-rs/build.rs "PATCH".
[patch.crates-io]
swift-rs = { path = "../../swift-rs" }

